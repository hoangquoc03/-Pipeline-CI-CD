image: gradle:7.6-jdk17

stages:
  - test
  - build
  - dockerize

before_script:
  - chmod +x ./gradlew

test_job:
  stage: test
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    POSTGRES_DB: cart_service_test
    POSTGRES_USER: cart_user
    POSTGRES_PASSWORD: cart_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart_service_test
    SPRING_DATASOURCE_USERNAME: cart_user
    SPRING_DATASOURCE_PASSWORD: cart_password
  script:
    - ./gradlew test
  allow_failure: false

build_job:
  stage: build
  script:
    - ./gradlew build -x test
    - |
      set -eu
      jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
      test -n "$jar_file"
      mkdir -p build/docker
      cp "$jar_file" build/docker/app.jar
  artifacts:
    paths:
      - build/docker/app.jar
    expire_in: 1 day

dockerize_job:
  stage: dockerize
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  dependencies:
    - build_job
  script:
    - test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PASSWORD"
    - printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
    - docker build -t "$DOCKER_USERNAME/cart-service:$CI_COMMIT_SHORT_SHA" .
    - docker push "$DOCKER_USERNAME/cart-service:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
