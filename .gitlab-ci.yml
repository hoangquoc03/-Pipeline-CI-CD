image: gradle:7.6-jdk17

stages:
  - test
  - build

before_script:
  - chmod +x ./gradlew

test_job:
  stage: test
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    POSTGRES_DB: hr_management_test
    POSTGRES_USER: ci_user
    POSTGRES_PASSWORD: ci_password
  script:
    - ./gradlew test

build_job:
  stage: build
  script:
    - ./gradlew build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day
